<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Arcade</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stars"></canvas>
  <main class="wrap">
    <header class="hero">
      <div>
        <div class="kicker">local studio</div>
        <h1>Lumen Arcade</h1>
        <p class="lede">A different toy every fifteen seconds. Nothing to win, just play.</p>
      </div>
      <div class="stat">
        121 studios<br />
        keyboard + mouse<br />
        runs offline
      </div>
    </header>

    <section class="grid" id="grid"></section>
<script src="games/catalog.js"></script>
<script src="games/hopper.js"></script>
<script>
  // Build cards from ARCADE array generated by _build.mjs
  const grid = document.getElementById('grid');
  const swatchClasses = ['s1','s2','s3','s4','s5','s6'];
  ARCADE.forEach((item,i)=>{
    const [file,tag,title,desc] = item;
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'games/' + file;
    const sw = document.createElement('div');
    sw.className = 'swatch ' + swatchClasses[i % swatchClasses.length];
    a.appendChild(sw);
    const tg = document.createElement('div');
    tg.className = 'tag';
    tg.textContent = tag;
    a.appendChild(tg);
    const h2 = document.createElement('h2');
    h2.textContent = title;
    a.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = desc;
    a.appendChild(p);
    const span = document.createElement('span');
    span.className = 'play';
    span.textContent = 'Open';
    a.appendChild(span);
    grid.appendChild(a);
  });
  // Update studio count
  const stat = document.querySelector('.stat');
  if (stat) stat.innerHTML = `${ARCADE.length} studios<br />keyboard + mouse<br />runs offline`;
</script>

    <footer>Open index.html anytime — the whole arcade lives in this folder.</footer>
  </main>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    let W = 0, H = 0;
    const n = 90;
    const stars = Array.from({ length: n }, () => ({
      x: Math.random(),
      y: Math.random(),
      z: 0.3 + Math.random() * 0.7,
      a: Math.random() * Math.PI * 2,
    }));
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function tick(t) {
      ctx.fillStyle = "#03040a";
      ctx.fillRect(0, 0, W, H);
      for (const s of stars) {
        const x = (s.x * W + Math.sin(t * 0.00008 + s.a) * 12 * s.z);
        const y = (s.y * H + Math.cos(t * 0.0001 + s.a) * 8 * s.z);
        ctx.fillStyle = `rgba(180,210,255,${0.18 + s.z * 0.45})`;
        ctx.fillRect(x, y, 1.4 * s.z, 1.4 * s.z);
      }
      requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
