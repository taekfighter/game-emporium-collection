<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prism Break — Lumen Arcade</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; color: rgba(230,240,255,0.78); }
    #title { position: absolute; top: 68px; left: 32px; letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; }
    #title b { display: block; font-size: 28px; color: #f4f7ff; margin-top: 6px; letter-spacing: 0.08em; }
    #meta { position: absolute; top: 28px; right: 32px; text-align: right; font-size: 12px; letter-spacing: 0.06em; }
    #hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">Arcade</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">arcade<b>Prism Break</b></div>
    <div id="meta"><div id="score">0</div><div id="lives">lives · 3</div></div>
    <div id="hint">mouse moves the paddle · click or space to serve</div>
  </div>
  <div id="overlay"><div><h2 id="endtitle">Cleared</h2><p id="over">0</p><button id="again">Play again</button></div></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const colors = ["#ff8a4a","#ffe08a","#7ee0c4","#6cb6ff","#d38bff"];
    let W, H, paddleX, ball, bricks, score, lives, running, served;
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function layoutBricks() {
      bricks = [];
      const cols = 11, rows = 5, gap = 8;
      const bw = Math.min(92, (W - 160) / cols - gap);
      const ox = (W - cols * (bw + gap)) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({ x: ox + c * (bw + gap), y: 120 + r * 32, w: bw, h: 22, alive: true, color: colors[r] });
        }
      }
    }
    function reset(full = true) {
      if (full) { score = 0; lives = 3; }
      layoutBricks();
      paddleX = W / 2;
      ball = { x: W / 2, y: H - 90, vx: 5.2, vy: -6.4, r: 7 };
      served = false; running = true;
      document.getElementById("overlay").classList.remove("show");
    }
    function end(win) {
      running = false;
      document.getElementById("endtitle").textContent = win ? "Lattice down" : "Spark lost";
      document.getElementById("over").textContent = score + " pts";
      document.getElementById("overlay").classList.add("show");
    }
    function tick() {
      ctx.fillStyle = "#03040a"; ctx.fillRect(0, 0, W, H);
      const pw = 118, ph = 12, py = H - 54;
      ctx.fillStyle = "#ffb07a";
      ctx.fillRect(paddleX - pw / 2, py, pw, ph);
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      if (running && served) {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
        if (ball.y < ball.r) ball.vy *= -1;
        if (ball.y + ball.r >= py && ball.y < py + ph && ball.x > paddleX - pw / 2 && ball.x < paddleX + pw / 2) {
          const t = (ball.x - paddleX) / (pw / 2);
          ball.vx = t * 6.5;
          ball.vy = -Math.abs(ball.vy) - 0.08;
          ball.y = py - ball.r;
        }
        for (const b of bricks) {
          if (!b.alive) continue;
          if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
            b.alive = false; score += 10; ball.vy *= -1;
          }
        }
        if (ball.y > H) {
          lives--; served = false; ball.x = paddleX; ball.y = py - 20; ball.vy = -6.4;
          if (lives <= 0) end(false);
        }
        if (bricks.every((b) => !b.alive)) end(true);
      } else if (running) {
        ball.x = paddleX; ball.y = py - 20;
      }
      ctx.fillStyle = "#fff4d6";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      document.getElementById("score").textContent = score + " pts";
      document.getElementById("lives").textContent = "lives · " + lives;
      requestAnimationFrame(tick);
    }
    addEventListener("resize", () => { resize(); layoutBricks(); });
    addEventListener("pointermove", (e) => { paddleX = e.clientX; });
    function serve() { if (running && !served) served = true; }
    addEventListener("pointerdown", (e) => { if (!e.target.closest("a,button")) serve(); });
    addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); serve(); } });
    document.getElementById("again").onclick = () => reset(true);
    resize(); reset(true); requestAnimationFrame(tick);
  </script>
</body>
</html>
