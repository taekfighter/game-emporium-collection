<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Pong — Lumen Arcade</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; color: rgba(230,240,255,0.78); }
    #title { position: absolute; top: 68px; left: 32px; letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; }
    #title b { display: block; font-size: 28px; color: #f4f7ff; margin-top: 6px; letter-spacing: 0.08em; }
    #meta { position: absolute; top: 28px; right: 32px; text-align: right; font-size: 12px; letter-spacing: 0.06em; }
    #hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">Arcade</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">duel<b>Vector Pong</b></div>
    <div id="meta"><div id="score">0 — 0</div><div>first to 7</div></div>
    <div id="hint">move the mouse to hit · you are the left paddle</div>
  </div>
  <div id="overlay"><div><h2 id="endtitle">Set over</h2><p id="over"></p><button id="again">Rematch</button></div></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    let W, H, py, ay, ball, you, cpu, freeze;
    const PH = 96, PW = 12;
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function serve(dir) {
      const a = (Math.random() * 0.6 - 0.3);
      ball = { x: W / 2, y: H / 2, vx: dir * 7.2, vy: a * 8 };
    }
    function reset(full = true) {
      if (full) { you = 0; cpu = 0; }
      py = H / 2; ay = H / 2; freeze = false;
      serve(Math.random() < 0.5 ? -1 : 1);
      document.getElementById("overlay").classList.remove("show");
    }
    function clamp(v) { return Math.max(PH / 2 + 8, Math.min(H - PH / 2 - 8, v)); }
    function tick() {
      ctx.fillStyle = "rgba(3,4,10,0.35)"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.setLineDash([8, 12]);
      ctx.beginPath(); ctx.moveTo(W / 2, 20); ctx.lineTo(W / 2, H - 20); ctx.stroke();
      ctx.setLineDash([]);
      if (!freeze) {
        ay += ((ball.y - ay) * 0.09);
        ay = clamp(ay); py = clamp(py);
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.y < 12 || ball.y > H - 12) ball.vy *= -1;
        if (ball.x < 48 + PW && ball.x > 36 && Math.abs(ball.y - py) < PH / 2 + 8) {
          ball.x = 48 + PW; ball.vx = Math.abs(ball.vx) + 0.25; ball.vy += (ball.y - py) * 0.08;
        }
        if (ball.x > W - 48 - PW && ball.x < W - 36 && Math.abs(ball.y - ay) < PH / 2 + 8) {
          ball.x = W - 48 - PW; ball.vx = -Math.abs(ball.vx) - 0.25; ball.vy += (ball.y - ay) * 0.08;
        }
        if (ball.x < 0) { cpu++; serve(1); }
        if (ball.x > W) { you++; serve(-1); }
        if (you >= 7 || cpu >= 7) {
          freeze = true;
          document.getElementById("endtitle").textContent = you >= 7 ? "You take the set" : "CPU takes the set";
          document.getElementById("over").textContent = you + " — " + cpu;
          document.getElementById("overlay").classList.add("show");
        }
      }
      ctx.fillStyle = "#ffe08a"; ctx.fillRect(36, py - PH / 2, PW, PH);
      ctx.fillStyle = "#7ee0c4"; ctx.fillRect(W - 48, ay - PH / 2, PW, PH);
      ctx.fillStyle = "#f4f7ff";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2); ctx.fill();
      document.getElementById("score").textContent = you + " — " + cpu;
      requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    addEventListener("pointermove", (e) => { py = e.clientY; });
    document.getElementById("again").onclick = () => reset(true);
    resize(); reset(true); requestAnimationFrame(tick);
  </script>
</body>
</html>
