<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ember Serpent — Lumen Arcade</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; color: rgba(230,240,255,0.78); }
    #title { position: absolute; top: 68px; left: 32px; letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; }
    #title b { display: block; font-size: 28px; color: #f4f7ff; margin-top: 6px; letter-spacing: 0.08em; }
    #meta { position: absolute; top: 28px; right: 32px; text-align: right; font-size: 12px; letter-spacing: 0.06em; }
    #hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">Arcade</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">classic<b>Ember Serpent</b></div>
    <div id="meta"><div id="score">0</div><div id="best">best · 0</div></div>
    <div id="hint">arrow keys or WASD · eat embers, avoid yourself</div>
  </div>
  <div id="overlay"><div><h2>Burned out</h2><p id="over">0</p><button id="again">Slither again</button></div></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const CELL = 22;
    let W, H, cols, rows, snake, dir, nextDir, food, score, best = 0, acc, alive;
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.floor(W / CELL); rows = Math.floor(H / CELL);
    }
    function placeFood() {
      do {
        food = { x: 2 + Math.floor(Math.random() * (cols - 4)), y: 4 + Math.floor(Math.random() * (rows - 6)) };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }
    function reset() {
      const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 }; nextDir = { ...dir }; score = 0; acc = 0; alive = true;
      placeFood();
      document.getElementById("overlay").classList.remove("show");
    }
    function die() {
      alive = false; best = Math.max(best, score);
      document.getElementById("over").textContent = score + " embers";
      document.getElementById("overlay").classList.add("show");
    }
    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows) return die();
      if (snake.some((s) => s.x === head.x && s.y === head.y)) return die();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { score++; placeFood(); }
      else snake.pop();
    }
    let last = 0;
    function tick(now) {
      const ox = (W - cols * CELL) / 2, oy = (H - rows * CELL) / 2;
      ctx.fillStyle = "#03040a"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.03)";
      for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(ox + x * CELL, oy); ctx.lineTo(ox + x * CELL, oy + rows * CELL); ctx.stroke(); }
      if (alive) {
        acc += now - last;
        const interval = Math.max(70, 140 - score * 3);
        while (acc > interval) { acc -= interval; step(); }
      }
      last = now;
      ctx.fillStyle = "#ff6ea8";
      ctx.fillRect(ox + food.x * CELL + 4, oy + food.y * CELL + 4, CELL - 8, CELL - 8);
      snake.forEach((s, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0 ? "#f4f7ff" : `rgba(211,139,255,${1 - t * 0.7})`;
        ctx.fillRect(ox + s.x * CELL + 1, oy + s.y * CELL + 1, CELL - 2, CELL - 2);
      });
      document.getElementById("score").textContent = score + " embers";
      document.getElementById("best").textContent = "best · " + best;
      requestAnimationFrame(tick);
    }
    addEventListener("resize", () => { resize(); if (food.x >= cols || food.y >= rows) placeFood(); });
    addEventListener("keydown", (e) => {
      const map = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] };
      const k = e.key.toLowerCase();
      if (map[k]) {
        e.preventDefault();
        const [x, y] = map[k];
        if (x !== -dir.x || y !== -dir.y) nextDir = { x, y };
      }
      if ((e.key === " " || e.key === "Enter") && !alive) reset();
    });
    document.getElementById("again").onclick = reset;
    resize(); reset(); requestAnimationFrame(tick);
  </script>
</body>
</html>
