<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Margin Notes — Lumen Arcade</title>
<link rel="stylesheet" href="chrome.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e7dcc4; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    color: rgba(60, 40, 20, 0.62);
  }
  #title { position: absolute; top: 68px; left: 32px; letter-spacing: .28em; text-transform: uppercase; font-size: 11px; }
  #title b { display: block; font-size: 28px; color: #2a1c10; margin-top: 6px; letter-spacing: .08em; }
  #meta { position: absolute; top: 28px; right: 32px; text-align: right; font-size: 12px; letter-spacing: .06em; line-height: 1.7; }
  #hint {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    font-size: 13px; text-align: center; color: rgba(60, 40, 20, 0.72);
    background: rgba(231, 220, 196, 0.72); border: 1px solid rgba(60, 40, 20, 0.14);
    padding: 10px 16px; border-radius: 999px; transition: opacity 1s;
  }
  .back { color: rgba(42, 28, 16, 0.78); background: rgba(231, 220, 196, 0.7); border-color: rgba(60, 40, 20, 0.18); }
</style>
</head>
<body>
<a class="back" href="../index.html">Arcade</a>
<canvas id="c"></canvas>
<div id="hud">
  <div id="title">doodle<b>Margin Notes</b></div>
  <div id="meta"><div id="m1"></div><div id="m2"></div></div>
  <div id="hint">type anywhere · click a word to pull its thread · R new page · Space clear ink</div>
</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dpr = Math.min(devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintPage();
}
addEventListener("resize", resize);

const $ = id => document.getElementById(id);
setTimeout(() => $("hint").style.opacity = ".22", 9000);

const INK = "#2a1c10";
const words = [];
const threads = [];
let draft = "";
let cursorOn = true;
setInterval(() => { cursorOn = !cursorOn; }, 530);

function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let pageSeed = (Math.random() * 1e9) | 0;
let rng = mulberry(pageSeed);

function paintPage() {
  ctx.fillStyle = "#e7dcc4";
  ctx.fillRect(0, 0, W, H);
  const r = mulberry(pageSeed ^ 0x51ed);
  for (let i = 0; i < 900; i++) {
    const x = r() * W, y = r() * H;
    ctx.fillStyle = `rgba(90,60,30,${0.03 + r() * 0.05})`;
    ctx.fillRect(x, y, 1 + r() * 1.4, 1);
  }
  ctx.strokeStyle = "rgba(196, 92, 92, 0.45)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(78, 0); ctx.lineTo(78, H);
  ctx.stroke();
  ctx.strokeStyle = "rgba(160, 70, 70, 0.22)";
  ctx.beginPath();
  ctx.moveTo(82, 0); ctx.lineTo(82, H);
  ctx.stroke();
  for (const w of words) stamp(w);
}

function measure(text) {
  ctx.font = "italic 22px Georgia, 'Times New Roman', serif";
  return ctx.measureText(text).width;
}

function stamp(w) {
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(w.tilt);
  ctx.font = "italic 22px Georgia, 'Times New Roman', serif";
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.92;
  ctx.fillText(w.text, 0, 0);
  ctx.restore();
}

function placeWord(text) {
  const width = Math.max(18, measure(text));
  const pad = 110;
  let x = pad + rng() * Math.max(40, W - pad - width - 40);
  let y = 120 + rng() * Math.max(40, H - 200);
  for (let tries = 0; tries < 12; tries++) {
    const hit = words.some(o => Math.hypot(o.x - x, o.y - y) < 70);
    if (!hit) break;
    x = pad + rng() * Math.max(40, W - pad - width - 40);
    y = 120 + rng() * Math.max(40, H - 200);
  }
  const w = { text, x, y, width, tilt: (rng() - 0.5) * 0.18, phase: rng() * Math.PI * 2 };
  words.push(w);
  stamp(w);
  return w;
}

function weave(a, b) {
  if (a === b || threads.some(t => (t.a === a && t.b === b) || (t.a === b && t.b === a))) return;
  const steps = 18;
  const pts = [];
  const mx = (a.x + b.x) / 2 + (rng() - 0.5) * 90;
  const my = (a.y + b.y) / 2 + (rng() - 0.5) * 70;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const x = (1 - u) * (1 - u) * (a.x + 8) + 2 * (1 - u) * u * mx + u * u * (b.x + 8);
    const y = (1 - u) * (1 - u) * (a.y - 6) + 2 * (1 - u) * u * my + u * u * (b.y - 6);
    pts.push({ x, y, ox: x, oy: y });
  }
  threads.push({ a, b, pts, wobble: 6 + rng() * 10, phase: rng() * 6 });
}

function nearest(x, y) {
  let best = null, d = 46;
  for (const w of words) {
    const dist = Math.hypot(w.x + w.width * 0.4 - x, w.y - 8 - y);
    if (dist < d) { d = dist; best = w; }
  }
  return best;
}

function commit() {
  const text = draft.trim().slice(0, 28);
  draft = "";
  if (!text) return;
  const born = placeWord(text);
  if (words.length > 1) {
    const others = words.filter(w => w !== born);
    others.sort((p, q) => Math.hypot(p.x - born.x, p.y - born.y) - Math.hypot(q.x - born.x, q.y - born.y));
    weave(born, others[0]);
    if (others[1] && rng() > 0.35) weave(born, others[1]);
  }
  refresh();
}

function clearInk() {
  words.length = 0;
  threads.length = 0;
  draft = "";
  paintPage();
  refresh();
}

function newPage() {
  pageSeed = (Math.random() * 1e9) | 0;
  rng = mulberry(pageSeed);
  clearInk();
}

function refresh() {
  $("m1").textContent = "words · " + words.length;
  $("m2").textContent = "threads · " + threads.length;
}
refresh();

addEventListener("pointerdown", e => {
  if (e.target.closest("a")) return;
  const hit = nearest(e.clientX, e.clientY);
  if (!hit || words.length < 2) return;
  const others = words.filter(w => w !== hit);
  const pick = others[(rng() * others.length) | 0];
  weave(hit, pick);
  refresh();
});

addEventListener("keydown", e => {
  if (e.target.closest("a")) return;
  if (e.key === "Enter") { e.preventDefault(); commit(); return; }
  if (e.key === "Backspace") { draft = draft.slice(0, -1); return; }
  if (e.key === "Escape") { draft = ""; return; }
  if (e.code === "Space" && !draft) { e.preventDefault(); clearInk(); return; }
  if (e.key.toLowerCase() === "r" && !draft) { newPage(); return; }
  if (e.key === " " || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)) {
    if (draft.length < 28) draft += e.key;
  }
});

function tick(now) {
  paintPage();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const t of threads) {
    ctx.beginPath();
    for (let i = 0; i < t.pts.length; i++) {
      const p = t.pts[i];
      const u = i / (t.pts.length - 1);
      const wave = Math.sin(now * 0.0011 + t.phase + u * 5) * t.wobble * Math.sin(u * Math.PI);
      const nx = -(t.b.y - t.a.y);
      const ny = t.b.x - t.a.x;
      const len = Math.hypot(nx, ny) || 1;
      p.x = p.ox + (nx / len) * wave;
      p.y = p.oy + (ny / len) * wave;
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "rgba(42, 28, 16, 0.55)";
    ctx.lineWidth = 1.15;
    ctx.stroke();
  }
  if (draft || cursorOn) {
    ctx.font = "italic 22px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = "rgba(42, 28, 16, 0.45)";
    const shown = draft + (cursorOn ? "|" : "");
    ctx.fillText(shown, 108, H - 64);
  }
  requestAnimationFrame(tick);
}
resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
