<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Ink Tide — Lumen Arcade</title><link rel="stylesheet" href="chrome.css" /><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#03040a}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif;color:rgba(230,240,255,.78)}#title{position:absolute;top:68px;left:32px;letter-spacing:.28em;text-transform:uppercase;font-size:11px}#title b{display:block;font-size:28px;color:#f4f7ff;margin-top:6px;letter-spacing:.08em}#meta{position:absolute;top:28px;right:32px;text-align:right;font-size:12px;letter-spacing:.06em;line-height:1.7}#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:13px;text-align:center;background:rgba(8,10,20,.45);border:1px solid rgba(255,255,255,.08);padding:10px 16px;border-radius:999px;transition:opacity 1s;white-space:nowrap}</style></head><body><a class="back" href="../index.html">Arcade</a><canvas id="c"></canvas><div id="hud"><div id="title">fluid<b>Ink Tide</b></div><div id="meta"><div id="m1"></div><div id="m2"></div></div><div id="hint">move the mouse to stir the ink · click for a burst · 1-4 palette · Space splash · C clear</div></div><script src="catalog.js"></script><script src="hopper.js"></script>
<script>const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);let W,H;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#03040a";ctx.fillRect(0,0,W,H)}addEventListener("resize",resize);resize();const $=id=>document.getElementById(id);setTimeout(()=>$("hint").style.opacity=".18",9000);
const GW=150,PN=["rainbow","fire","ice","orchid"],PR=[[0,360],[0,55],[170,250],[270,340]];let GH,S,u,v,tmp,tv,dr,dg,db,p,dv,pal=0,last=null,idle=0,t0=0,off=document.createElement("canvas"),oc=off.getContext("2d"),img;
function init(){GH=Math.max(40,Math.round(GW*H/W));S=GW+2;const n=S*(GH+2),F=()=>new Float32Array(n);u=F();v=F();tmp=F();tv=F();dr=F();dg=F();db=F();p=F();dv=F();off.width=GW;off.height=GH;img=oc.createImageData(GW,GH)}
init();addEventListener("resize",init);
function info(){$("m1").textContent="palette · "+PN[pal];$("m2").textContent="grid · "+GW+" x "+GH}info();
function hsv(h){h=((h%360)+360)%360/60;const i=Math.floor(h),f=h-i,q=1-f,c=[[1,f,0],[q,1,0],[0,1,f],[0,q,1],[f,0,1],[1,0,q]][i%6];return c}
function col(t){const r=PR[pal];return hsv(pal===0?t*50:r[0]+(r[1]-r[0])*(.5+.5*Math.sin(t*.7)))}
function splat(x,y,dx,dy,r,c,a){const gx=x/W*GW,gy=y/H*GH,R=Math.ceil(r*2.2);for(let j=Math.max(1,Math.floor(gy-R));j<=Math.min(GH,Math.ceil(gy+R));j++)for(let i=Math.max(1,Math.floor(gx-R));i<=Math.min(GW,Math.ceil(gx+R));i++){const d2=(i-gx)*(i-gx)+(j-gy)*(j-gy),w=Math.exp(-d2/(r*r)),k=i+S*j;u[k]+=dx*w;v[k]+=dy*w;dr[k]+=c[0]*a*w;dg[k]+=c[1]*a*w;db[k]+=c[2]*a*w}}
addEventListener("pointermove",e=>{idle=0;const x=e.clientX,y=e.clientY;if(last){const dx=(x-last[0])/W*GW,dy=(y-last[1])/H*GH,sp=Math.min(1,Math.hypot(dx,dy)/3);splat(x,y,dx*.9,dy*.9,4.5,col(performance.now()/1000),.5*sp+.05)}last=[x,y]});
addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;idle=0;const c=col(performance.now()/1000);splat(e.clientX,e.clientY,0,0,7,c,1.6);for(let k=0;k<14;k++){const a=k/14*6.283;splat(e.clientX+Math.cos(a)*10,e.clientY+Math.sin(a)*10,Math.cos(a)*6,Math.sin(a)*6,4,hsv(k*25+pal*60),.5)}});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if("1234".includes(k)&&k.length===1){pal=+k-1;info()}else if(k==="c"){for(const a of [u,v,dr,dg,db])a.fill(0)}else if(e.code==="Space"){e.preventDefault();for(let n=0;n<6;n++){const a=Math.random()*6.283;splat(Math.random()*W,Math.random()*H,Math.cos(a)*7,Math.sin(a)*7,6,hsv(Math.random()*360),1.2)}}});
function bnd(b,x){for(let i=1;i<=GW;i++){x[i]=b===2?-x[i+S]:x[i+S];x[i+S*(GH+1)]=b===2?-x[i+S*GH]:x[i+S*GH]}for(let j=1;j<=GH;j++){x[S*j]=b===1?-x[1+S*j]:x[1+S*j];x[GW+1+S*j]=b===1?-x[GW+S*j]:x[GW+S*j]}}
function adv(d,s,uu,vv){for(let j=1;j<=GH;j++)for(let i=1;i<=GW;i++){const k=i+S*j;let x=i-uu[k],y=j-vv[k];x=x<.5?.5:x>GW+.5?GW+.5:x;y=y<.5?.5:y>GH+.5?GH+.5:y;const i0=x|0,j0=y|0,fx=x-i0,fy=y-j0,q=i0+S*j0;d[k]=(1-fx)*((1-fy)*s[q]+fy*s[q+S])+fx*((1-fy)*s[q+1]+fy*s[q+S+1])}}
function proj(){for(let j=1;j<=GH;j++)for(let i=1;i<=GW;i++){const k=i+S*j;dv[k]=-.5*(u[k+1]-u[k-1]+v[k+S]-v[k-S]);p[k]=0}bnd(0,dv);bnd(0,p);
for(let n=0;n<18;n++){for(let j=1;j<=GH;j++)for(let i=1;i<=GW;i++){const k=i+S*j;p[k]=(dv[k]+p[k-1]+p[k+1]+p[k-S]+p[k+S])*.25}bnd(0,p)}
for(let j=1;j<=GH;j++)for(let i=1;i<=GW;i++){const k=i+S*j;u[k]-=.5*(p[k+1]-p[k-1]);v[k]-=.5*(p[k+S]-p[k-S])}bnd(1,u);bnd(2,v)}
function vort(){for(let j=2;j<GH;j++)for(let i=2;i<GW;i++){const k=i+S*j,w=(v[k+1]-v[k-1]-u[k+S]+u[k-S])*.5,wl=Math.abs((v[k]-v[k-2])-(u[k]-u[k-2*S])),wr=Math.abs((v[k+2]-v[k])-(u[k+2*S]-u[k])),wu=Math.abs((v[k+S+1]-v[k+S-1])-(u[k+2*S]-u[k])),wd=Math.abs((v[k-S+1]-v[k-S-1])-(u[k]-u[k-2*S]));
const gx=(wr-wl)*.5,gy=(wu-wd)*.5,m=Math.hypot(gx,gy)+1e-5;tmp[k]=gy/m*w*.35;tv[k]=-gx/m*w*.35}for(let j=2;j<GH;j++)for(let i=2;i<GW;i++){const k=i+S*j;u[k]+=tmp[k];v[k]+=tv[k]}}
function tick(now){const t=now/1000;idle+=1;
if(idle>200){const a=t*.7;splat(W*(.5+.3*Math.cos(a)),H*(.5+.3*Math.sin(a*1.3)),Math.cos(a+1.5)*1.6,Math.sin(a*1.3+1.5)*1.6,4,col(t),.18);splat(W*(.5+.3*Math.cos(a+3)),H*(.5+.25*Math.sin(a*.9)),-Math.cos(a)*1.4,Math.sin(a)*1.4,4,col(t+3),.18)}
vort();tmp.set(u);tv.set(v);adv(u,tmp,tmp,tv);adv(v,tv,tmp,tv);proj();
for(const d of [dr,dg,db]){tmp.set(d);adv(d,tmp,u,v)}
const dat=img.data;for(let j=1;j<=GH;j++)for(let i=1;i<=GW;i++){const k=i+S*j,o=((j-1)*GW+i-1)*4;dr[k]*=.993;dg[k]*=.993;db[k]*=.993;u[k]*=.9995;v[k]*=.9995;
dat[o]=Math.min(255,3+dr[k]*400);dat[o+1]=Math.min(255,4+dg[k]*400);dat[o+2]=Math.min(255,10+db[k]*400);dat[o+3]=255}
oc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(off,0,0,W,H);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
