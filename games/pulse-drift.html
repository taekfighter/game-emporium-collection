<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Drift — Lumen Arcade</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color: rgba(230, 240, 255, 0.78);
    }
    #title { position: absolute; top: 68px; left: 32px; letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; }
    #title b { display: block; font-size: 28px; letter-spacing: 0.08em; color: #f4f7ff; margin-top: 6px; }
    #meta { position: absolute; top: 28px; right: 32px; text-align: right; letter-spacing: 0.06em; font-size: 12px; }
    #hint { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">Arcade</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">endless<b>Pulse Drift</b></div>
    <div id="meta"><div id="score">0 m</div><div id="best">best · 0 m</div></div>
    <div id="hint">move the mouse to steer · survive the gates</div>
  </div>
  <div id="overlay"><div><h2>Signal lost</h2><p id="over">0 m</p><button id="again">Run again</button></div></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    let W = 0, H = 0, shipY = 0, targetY = 0, dist = 0, best = 0, speed = 7, alive = true;
    const gates = [];
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!shipY) { shipY = H / 2; targetY = H / 2; }
    }
    function spawnGate(x) {
      const gap = Math.max(110, 210 - dist / 900);
      const gy = 80 + Math.random() * (H - 160 - gap);
      gates.push({ x, y: gy, gap, w: 28 });
    }
    function reset() {
      gates.length = 0; dist = 0; speed = 7; alive = true; shipY = H / 2; targetY = H / 2;
      for (let i = 0; i < 5; i++) spawnGate(W * 0.55 + i * 280);
      document.getElementById("overlay").classList.remove("show");
    }
    function die() {
      alive = false;
      best = Math.max(best, dist);
      document.getElementById("over").textContent = Math.floor(dist) + " m";
      document.getElementById("overlay").classList.add("show");
    }
    function tick() {
      ctx.fillStyle = "#03040a"; ctx.fillRect(0, 0, W, H);
      if (alive) {
        shipY += (targetY - shipY) * 0.18;
        dist += speed * 0.35;
        speed += 0.0022;
        for (const g of gates) g.x -= speed;
        if (gates[0] && gates[0].x < -40) { gates.shift(); spawnGate(gates[gates.length - 1].x + 280); }
      }
      ctx.strokeStyle = "rgba(108,182,255,0.85)";
      ctx.lineWidth = 3;
      for (const g of gates) {
        ctx.fillStyle = "rgba(40,90,160,0.35)";
        ctx.fillRect(g.x, 0, g.w, g.y);
        ctx.fillRect(g.x, g.y + g.gap, g.w, H - (g.y + g.gap));
        ctx.strokeRect(g.x + 0.5, 0.5, g.w, g.y);
        ctx.strokeRect(g.x + 0.5, g.y + g.gap + 0.5, g.w, H - (g.y + g.gap));
        const sx = 160, r = 10;
        if (alive && sx + r > g.x && sx - r < g.x + g.w) {
          if (shipY - r < g.y || shipY + r > g.y + g.gap) die();
        }
      }
      ctx.fillStyle = "#9fd7ff";
      ctx.beginPath(); ctx.arc(160, shipY, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(159,215,255,0.25)";
      ctx.beginPath(); ctx.arc(160, shipY, 18, 0, Math.PI * 2); ctx.fill();
      if (shipY < 12 || shipY > H - 12) die();
      document.getElementById("score").textContent = Math.floor(dist) + " m";
      document.getElementById("best").textContent = "best · " + Math.floor(best) + " m";
      requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    addEventListener("pointermove", (e) => { targetY = e.clientY; });
    document.getElementById("again").onclick = reset;
    addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!alive) reset(); } });
    resize(); reset(); requestAnimationFrame(tick);
  </script>
</body>
</html>
