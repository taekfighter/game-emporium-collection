<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo Signal — Lumen Arcade</title>
  <link rel="stylesheet" href="chrome.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: rgba(230,240,255,0.78); }
    #title { position: absolute; top: 68px; left: 32px; letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; }
    #title b { display: block; font-size: 28px; color: #f4f7ff; margin-top: 6px; letter-spacing: 0.08em; }
    #meta { position: absolute; top: 28px; right: 32px; text-align: right; font-size: 12px; letter-spacing: 0.06em; }
    #hint { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); font-size: 13px; }
    .board {
      position: fixed; inset: 0; display: grid; place-items: center;
    }
    .pads {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: min(420px, 70vw);
    }
    .pad {
      aspect-ratio: 1; border: 0; border-radius: 22px; cursor: pointer;
      opacity: 0.42; transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .pad.on, .pad:active { opacity: 1; transform: scale(0.97); }
    .p0 { background: #6cb6ff; }
    .p1 { background: #7ee0c4; }
    .p2 { background: #ff8a4a; }
    .p3 { background: #d38bff; }
    .status { margin-top: 22px; text-align: center; color: rgba(230,240,255,0.7); letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">Arcade</a>
  <div id="hud">
    <div id="title">memory<b>Echo Signal</b></div>
    <div id="meta"><div id="score">round 0</div><div id="best">best · 0</div></div>
    <div id="hint">watch the pulses · click them back in order</div>
  </div>
  <div class="board">
    <div>
      <div class="pads">
        <button class="pad p0" data-i="0" aria-label="blue"></button>
        <button class="pad p1" data-i="1" aria-label="teal"></button>
        <button class="pad p2" data-i="2" aria-label="ember"></button>
        <button class="pad p3" data-i="3" aria-label="violet"></button>
      </div>
      <div class="status" id="status">press any pad to start</div>
    </div>
  </div>
  <div id="overlay"><div><h2>Sequence broken</h2><p id="over">round 0</p><button id="again">Listen again</button></div></div>
  <script>
    const pads = [...document.querySelectorAll(".pad")];
    const freqs = [329.63, 392.0, 261.63, 440.0];
    let seq = [], step = 0, lock = true, round = 0, best = 0, started = false;
    let audio;
    function beep(i, dur = 0.28) {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.frequency.value = freqs[i];
      o.type = "sine";
      g.gain.value = 0.08;
      o.connect(g); g.connect(audio.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.stop(audio.currentTime + dur);
    }
    function flash(i, on) { pads[i].classList.toggle("on", on); }
    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
    async function playSeq() {
      lock = true;
      document.getElementById("status").textContent = "listen";
      await sleep(380);
      for (const i of seq) {
        flash(i, true); beep(i);
        await sleep(420);
        flash(i, false);
        await sleep(140);
      }
      step = 0; lock = false;
      document.getElementById("status").textContent = "your turn";
    }
    async function nextRound() {
      seq.push(Math.floor(Math.random() * 4));
      round = seq.length;
      best = Math.max(best, round);
      document.getElementById("score").textContent = "round " + round;
      document.getElementById("best").textContent = "best · " + best;
      await playSeq();
    }
    function fail() {
      lock = true;
      document.getElementById("over").textContent = "reached round " + round;
      document.getElementById("overlay").classList.add("show");
    }
    pads.forEach((p) => p.addEventListener("click", () => {
      const i = Number(p.dataset.i);
      if (!started) { started = true; seq = []; nextRound(); return; }
      if (lock) return;
      flash(i, true); beep(i, 0.18);
      setTimeout(() => flash(i, false), 160);
      if (i !== seq[step]) return fail();
      step++;
      if (step >= seq.length) { lock = true; document.getElementById("status").textContent = "good"; setTimeout(nextRound, 500); }
    }));
    document.getElementById("again").onclick = () => {
      document.getElementById("overlay").classList.remove("show");
      seq = []; started = true; nextRound();
    };
  </script>
</body>
</html>
