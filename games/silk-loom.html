<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Silk Loom — Lumen Arcade</title><link rel="stylesheet" href="chrome.css" /><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#03040a}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif;color:rgba(230,240,255,.78)}#title{position:absolute;top:68px;left:32px;letter-spacing:.28em;text-transform:uppercase;font-size:11px}#title b{display:block;font-size:28px;color:#f4f7ff;margin-top:6px;letter-spacing:.08em}#meta{position:absolute;top:28px;right:32px;text-align:right;font-size:12px;letter-spacing:.06em;line-height:1.7}#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:13px;text-align:center;background:rgba(8,10,20,.45);border:1px solid rgba(255,255,255,.08);padding:10px 16px;border-radius:999px;transition:opacity 1s}</style></head><body><a class="back" href="../index.html">Arcade</a><canvas id="c"></canvas><div id="hud"><div id="title">ribbons<b>Silk Loom</b></div><div id="meta"><div id="m1"></div><div id="m2"></div></div><div id="hint">drag to weave · HINTlt;kbdHINTgt;1HINTlt;/kbdHINTgt;–HINTlt;kbdHINTgt;4HINTlt;/kbdHINTgt; symmetry · C color · M mirror · Space clear</div></div><script src="catalog.js"></script><script src="hopper.js"></script>
<script>const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);let W,H;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#03040a";ctx.fillRect(0,0,W,H)}addEventListener("resize",resize);resize();const $=id=>document.getElementById(id);setTimeout(()=>$("hint").style.opacity=".18",9000);
const SYM=[3,6,8,12],HUES=[200,320,40,160];let si=1,hue=0,mirror=true,down=false,m={x:0,y:0,px:0,py:0},P=[],t=0;
function upd(){$("m1").textContent="symmetry · "+SYM[si];$("m2").textContent="mirror · "+(mirror?"on":"off")}upd();
addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;down=true;m.x=m.px=e.clientX;m.y=m.py=e.clientY});
addEventListener("pointerup",()=>down=false);
addEventListener("pointermove",e=>{m.px=m.x;m.py=m.y;m.x=e.clientX;m.y=e.clientY;if(!down)return;const vx=m.x-m.px,vy=m.y-m.py;
for(let i=0;i<4;i++)P.push({x:m.x-W/2,y:m.y-H/2,vx:vx*.25+(Math.random()-.5)*.8,vy:vy*.25+(Math.random()-.5)*.8,l:1,h:HUES[hue]+Math.random()*50-t*.02})});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if("1234".includes(k)&&k)si=+k-1;else if(k==="c")hue=(hue+1)%4;else if(k==="m")mirror=!mirror;else if(e.code==="Space"){e.preventDefault();ctx.fillStyle="#03040a";ctx.fillRect(0,0,W,H);P=[]}upd()});
function tick(now){t=now;ctx.globalCompositeOperation="source-over";ctx.fillStyle="rgba(3,4,10,.035)";ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="lighter";ctx.lineWidth=1.1;
const n=SYM[si];if(P.length>2600)P.splice(0,P.length-2600);
for(let i=P.length-1;i>=0;i--){const p=P[i],a=Math.sin(p.y*.006+now*.0004)*3+Math.cos(p.x*.005-now*.0003)*3;
p.vx+=Math.cos(a)*.07;p.vy+=Math.sin(a)*.07;p.vx*=.985;p.vy*=.985;const ox=p.x,oy=p.y;p.x+=p.vx;p.y+=p.vy;p.l-=.006;if(p.l<=0){P.splice(i,1);continue}
ctx.strokeStyle="hsla("+p.h+",90%,"+(55+p.l*15)+"%,"+(p.l*.5)+")";
for(let k=0;k<n;k++){ctx.save();ctx.translate(W/2,H/2);ctx.rotate(k*Math.PI*2/n);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();
if(mirror){ctx.scale(1,-1);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke()}ctx.restore()}}
requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
