<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Marble Pit — Lumen Arcade</title><link rel="stylesheet" href="chrome.css" /><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#03040a}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif;color:rgba(230,240,255,.78)}#title{position:absolute;top:68px;left:32px;letter-spacing:.28em;text-transform:uppercase;font-size:11px}#title b{display:block;font-size:28px;color:#f4f7ff;margin-top:6px;letter-spacing:.08em}#meta{position:absolute;top:28px;right:32px;text-align:right;font-size:12px;letter-spacing:.06em;line-height:1.7}#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:13px;text-align:center;background:rgba(8,10,20,.45);border:1px solid rgba(255,255,255,.08);padding:10px 16px;border-radius:999px;transition:opacity 1s;white-space:nowrap}</style></head><body><a class="back" href="../index.html">Arcade</a><canvas id="c"></canvas><div id="hud"><div id="title">collisions<b>Marble Pit</b></div><div id="meta"><div id="m1"></div><div id="m2"></div></div><div id="hint">click or hold to pour marbles · move the mouse to shove them · arrows tilt gravity · Space shake · C clear</div></div><script>const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);let W,H;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#03040a";ctx.fillRect(0,0,W,H)}addEventListener("resize",resize);resize();const $=id=>document.getElementById(id);setTimeout(()=>$("hint").style.opacity=".18",9000);
let B=[],g={x:0,y:.35},m={x:-999,y:-999,d:false},gName="down",sp=0;
function add(x,y){const r=9+Math.random()*13;B.push({x,y,px:x-(Math.random()-.5)*3,py:y-Math.random()*2,r,h:Math.random()*80+170+r*3});if(B.length>420)B.shift()}
for(let i=0;i<110;i++)add(Math.random()*W,Math.random()*H*.5);
addEventListener("pointerdown",e=>{if(!e.target.closest("a")){m.d=true;m.x=e.clientX;m.y=e.clientY}});addEventListener("pointerup",()=>m.d=false);
addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener("keydown",e=>{const D={ArrowDown:[0,.35,"down"],ArrowUp:[0,-.35,"up"],ArrowLeft:[-.35,0,"left"],ArrowRight:[.35,0,"right"]};
if(D[e.key]){e.preventDefault();g={x:D[e.key][0],y:D[e.key][1]};gName=D[e.key][2]}else if(e.key.toLowerCase()==="c")B=[];else if(e.code==="Space"){e.preventDefault();for(const b of B){b.px-=(Math.random()-.5)*16;b.py-=Math.random()*14}}});
function tick(){ctx.fillStyle="#03040a";ctx.fillRect(0,0,W,H);
if(m.d&&++sp%3===0)add(m.x+(Math.random()-.5)*20,m.y);
for(const b of B){let vx=(b.x-b.px)*.995,vy=(b.y-b.py)*.995;b.px=b.x;b.py=b.y;b.x+=vx+g.x;b.y+=vy+g.y;
const dx=b.x-m.x,dy=b.y-m.y,d=Math.hypot(dx,dy)||1,R=b.r+60;if(d<R&&!m.d){const f=(R-d)*.08;b.x+=dx/d*f;b.y+=dy/d*f}}
for(let k=0;k<4;k++){for(let i=0;i<B.length;i++){const a=B[i];for(let j=i+1;j<B.length;j++){const b=B[j],dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r;if(Math.abs(dx)>min||Math.abs(dy)>min)continue;const d=Math.hypot(dx,dy);if(d<min&&d>.001){const o=(min-d)/d*.5;a.x-=dx*o;a.y-=dy*o;b.x+=dx*o;b.y+=dy*o}}
if(a.x<a.r){a.x=a.r;a.px=a.x+(a.x-a.px)*0}if(a.x>W-a.r)a.x=W-a.r;if(a.y<a.r)a.y=a.r;if(a.y>H-a.r)a.y=H-a.r}}
for(const b of B){const sx=b.x-b.px,sy=b.y-b.py;if(b.x<=b.r+.5||b.x>=W-b.r-.5)b.px=b.x+sx*.5;if(b.y<=b.r+.5||b.y>=H-b.r-.5)b.py=b.y+sy*.5;
const gr=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,1,b.x,b.y,b.r);gr.addColorStop(0,"hsl("+b.h+",90%,82%)");gr.addColorStop(1,"hsl("+b.h+",75%,42%)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill()}
$("m1").textContent="marbles · "+B.length;$("m2").textContent="gravity · "+gName;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
